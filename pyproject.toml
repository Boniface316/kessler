# https://docs.astral.sh/uv/reference/settings/
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# PROJECT

[project]
name = "kesslercore"
version = "0.1.0"
description = "TODO"
authors = [{ name = "bonifaceECN" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.19.0",
    "pydantic-settings>=2.7.1",
    "pydantic>=2.10.5",
    "pandera>=0.22.1",
    "omegaconf>=2.3.0",
    "loguru>=0.7.3",
    "pync>=2.0.3",
    "pyperclip>=1.9.0",
    "torch>=2.5.1",
    "gtasks @git+https://github.com/Boniface316/tasks.git",
    "invoke>=2.2.0",
]
license = { file = "LICENSE.md" }
keywords = ["mlops", "python", "package"]

[tool.hatch.metadata]
allow-direct-references = true

# LINKS

[project.urls]
Homepage = "https://github.com/bonifaceECN/kessler"
Documentation = "https://bonifaceECN.github.io/kessler/"
Repository = "https://github.com/bonifaceECN/kesslere"
"Bug Tracker" = "https://github.com/bonifaceECN/kessler/issues"
Changelog = "https://github.com/bonifaceECN/kessler/blob/main/CHANGELOG.md"

# SCRIPTS

[project.scripts]
kesslercore = "kesslercore.scripts:main"

# DEPENDENCIES

[dependency-groups]
checks = [
    "bandit>=1.8.0",
    "coverage>=7.6.8",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.3",
    "ruff>=0.8.1",
]
commits = ["commitizen>=4.0.0", "pre-commit>=4.0.1"]
dev = ["invoke>=2.2.0"]
docs = ["pdoc>=15.0.0"]
notebooks = ["ipykernel>=6.29.5", "nbformat>=5.10.4"]

# TOOLS

[tool.uv]
default-groups = ["checks", "commits", "dev", "docs", "notebooks"]

[tool.bandit]
targets = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["__main__.py"]

[tool.mypy]
pretty = true
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--verbosity=2"
pythonpath = ["src"]

[tool.ruff]
fix = true
indent-width = 4
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]

# SYSTEMS

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
